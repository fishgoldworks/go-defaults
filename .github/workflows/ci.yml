name: Verify
on: [push, pull_request]
# The jobs need checkout and artifact transfer, not write or workflow permissions.
permissions:
  contents: read
jobs:
  candidate:
    # Use an Ubuntu image supported by the locked Playwright version.
    runs-on: ubuntu-24.04
    outputs:
      sha256: ${{ steps.archive.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium firefox webkit
      - id: archive
        run: GO_DEFAULTS_CI_CANDIDATE_OUTPUT="${GITHUB_OUTPUT:?}" npm run verify:all
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-candidate
          path: |
            ${{ steps.archive.outputs.archive }}
            ${{ steps.archive.outputs.archive }}.sha256
          if-no-files-found: error

  contributor-floor:
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-candidate
          path: artifacts
      - id: archive
        name: Check the producer archive digest
        env:
          EXPECTED_CANDIDATE_SHA256: ${{ needs.candidate.outputs.sha256 }}
        run: node scripts/check-ci-candidate.mjs "$EXPECTED_CANDIDATE_SHA256"
      - name: Verify the contributor floor against the same candidate
        env:
          CANDIDATE_TARBALL: ${{ steps.archive.outputs.archive }}
        run: npm run verify -- --tarball "$CANDIDATE_TARBALL"

  consumers:
    needs: candidate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['8.0.0', '13.0.0', '12.17.0', '24.20.0']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - name: Record the selected consumer runtime
        run: echo "CONSUMER_NODE=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-candidate
          path: artifacts
      - id: archive
        name: Check the producer archive digest
        env:
          EXPECTED_CANDIDATE_SHA256: ${{ needs.candidate.outputs.sha256 }}
        run: node scripts/check-ci-candidate.mjs "$EXPECTED_CANDIDATE_SHA256"
      - name: Check the exact archive on the selected runtime
        env:
          CANDIDATE_TARBALL: ${{ steps.archive.outputs.archive }}
        run: npm run test:runtime -- --tarball "$CANDIDATE_TARBALL" --node "$CONSUMER_NODE"

  typescript-compatibility:
    needs: candidate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        typescript: ['4.5.2', '4.7.2', '5.0.2', '5.4.5', '6.0.3']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '8.0.0'
      - name: Record the minimum CommonJS runtime
        run: echo "GO_DEFAULTS_NODE8=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-candidate
          path: artifacts
      - id: archive
        name: Check the producer archive digest
        env:
          EXPECTED_CANDIDATE_SHA256: ${{ needs.candidate.outputs.sha256 }}
        run: node scripts/check-ci-candidate.mjs "$EXPECTED_CANDIDATE_SHA256"
      - name: Install the verified package and selected compiler
        env:
          CANDIDATE_TARBALL: ${{ steps.archive.outputs.archive }}
        run: |
          npm install --prefix "$RUNNER_TEMP/consumer" --ignore-scripts --no-audit --no-fund "$CANDIDATE_TARBALL"
          npm install --prefix "$RUNNER_TEMP/compiler" --ignore-scripts --no-audit --no-fund "typescript@${{ matrix.typescript }}"
      - name: Check declarations and emitted consumers
        run: node scripts/test-types.mjs --compiler "$RUNNER_TEMP/compiler/node_modules/typescript/lib/tsc.js" --package "$RUNNER_TEMP/consumer/node_modules/go-defaults"
